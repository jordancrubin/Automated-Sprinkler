<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Wificfg setup framework" />
        <meta name="author" content="Jordan Rubin" />
        <title>ESP32 Network Configuration Page</title>
        <link href="css/styles.css" rel="stylesheet" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js" crossorigin="anonymous"></script>
        <style>
            #statusMessage { display: none; margin-top: 15px; padding: 10px; border-radius: 5px; }
            .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
            .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
            #spinner { display: none; }
        </style>
    </head>
    <body class="bg-light">
      <div id="wificonfigsetup">
        <div id="wifimain_content">
            <main>
              <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-5">
                         <div class="card shadow-lg border-0 rounded-lg mt-5">
                             <div class="card-header">
                                 <h3 class="text-center font-weight-light my-4">
                                     <i class="fas fa-wifi me-2"></i>Sprinkler32 Network Configuration
                                 </h3>
                             </div>
                             <div class="card-body">
                                 <div class="row mb-3">
                                     <div class="col-9">
                                         <div class="form-floating">
                                             <select id="Wifilist" class="form-select"></select>
                                             <label for="Wifilist">Available Networks</label>
                                         </div>
                                     </div>
                                     <div class="col-3 d-grid">
                                         <button type="button" id="refreshButton" class="btn btn-secondary">Refresh</button>
                                     </div>
                                 </div>
 
                                 <div id="keySection" style="display: none;">
                                     <div class="form-floating mb-3">
                                         <input type="password" id="keyfield" class="form-control" placeholder="Password" />
                                         <label for="keyfield">Password</label>
                                     </div>
                                     <div class="form-check mb-3">
                                         <input class="form-check-input" type="checkbox" id="showPassword">
                                         <label class="form-check-label" for="showPassword">Show Password</label>
                                     </div>
                                     <div class="d-grid">
                                         <button type="button" id="connectButton" class="btn btn-primary">
                                             <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display: none;"></span>
                                             <span class="button-text">Connect</span>
                                         </button>
                                     </div>
                                 </div>
                                 <div class="text-center mt-3">
                                     <div id="statusMessage"></div>
                                 </div>
                            </div>
                         </div>
                     </div>
                 </div>
               </div>
             </main>
         </div>
     </div>
     <script src="js/cfg_scripts.js"></script>
   </body>
</html>
