<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="ESP 32 Irrigation Automation Dashboard" />
        <meta name="author" content="Jordan Rubin" />
        <title>Dashboard - RubinTech</title>
        <link href="https://cdn.jsdelivr.net/npm/simple-datatables@latest/dist/style.css" rel="stylesheet" />
        <link href="css/styles.css" rel="stylesheet" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js" crossorigin="anonymous"></script>
    </head>
    <body class="sb-nav-fixed">
        <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
            <!-- Navbar Brand-->
            <a class="navbar-brand ps-3" href="index.html">ESP Irrigate</a>
            <!-- Sidebar Toggle-->
            <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i class="fas fa-bars"></i></button>
            <!-- Navbar Search -->
            <form class="d-none d-md-inline-block form-inline ms-auto me-0 me-md-3 my-2 my-md-0">
            </form>
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                    <div class="sb-sidenav-menu" id="sidenav-menu-content"> 
                    </div>
                </nav>
            </div>
            <div id="layoutSidenav_content">                
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4">Active Programme</h1>
                        <ol class="breadcrumb mb-4">
                            <select class="selectpicker" id="activeprog" onchange="activeProgChange()"><option value="4"SELECTED>Disabled</option>
                                <option value="1">Programme A</option>
                                <option value="2">Programme B</option>
                                <option value="3">Programme C</option>
                            </select>
                            <span id="rainsenseselector"></span>
                        </ol>
                        <div class="row">
                            <div class="col-xl-12 col-md-6">
                                <div class="card bg-light text-black mb-4">
                                    <div class="card-body">
                                      <h5 class="card-title"><div id="state"></div></h5>
                                      <p class="card-text"><div id="stateInfo"></div></p>
                                      <p class="card-text"><div id="valveState"></div></p>
                                      <p class="card-text"><div id="rainState"></div></p>
                                      <p class="card-text"> <div id="cancelbutton"><input class="btn btn-success" type="button" value="Cancel" onclick="cancelRun()"></div></p>
                                    </div>
                                  </div>
                            </div>
                        </div>
                            <div class="row">
                                <div class="col-xl-12 col-md-6">
                                    <div class="card bg-light text-black mb-4">
                                        <div class="card-body">
                                          <h5 class="card-title">Manual Run</h5>
                                          <p class="card-text"><div id="selectpicker"><select class="selectpicker" id="manualrunlist" onchange="manualRunListChange()"><option value="SELECTED">Choose one</option></select></div></p>
                                          <p class="card-text"><div id="manualrunbutton"><input class="btn btn-success" type="button" value="Begin" onclick="submitManualRun()"></div></p>
                                        </div>    
                                    </div>
                                </div>
                            </div>
                            <div class="card mb-4">
                                <div class="card-header">
                                    <i class="fas fa-table me-1"></i>
                                    Utilization
                                </div>
                                <div class="card-body">
                                    <table id="datatablesSimple">
                                        <thead>
                                            <tr>
                                                <th>Date</th>
                                                <th>Name</th>
                                                <th>Zone</th>
                                                <th>Duration</th>
                                                <th>Auto</th>
                                                <th>Consumption</th>
                                            </tr>
                                        </thead>
                                        <tfoot>
                                        <tbody>       
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                                <div class="card mb-4">
                                    <div class="card-header">
                                        <i class="fas fa-chart-bar me-1"></i>
                                        Event Log
                                    </div>
                                    <textarea class="form-control z-depth-1" style="overflow:auto;" id="eventLog" rows="19"></textarea>
                                </div>
                    </div>
                </main>
                <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-between small">
                            <div class="text-muted">Copyright &copy; Jordan Rubin 2023</div>
                            <div>
                                <a href="#">Privacy Policy</a>
                                &middot;
                                <a href="#">Terms &amp; Conditions</a>
                            </div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="js/scripts.js"></script>
        <script src="js/timezone.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.js" crossorigin="anonymous"></script>
        <script src="assets/demo/chart-area-demo.js"></script>
        <script src="assets/demo/chart-bar-demo.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/simple-datatables@latest" crossorigin="anonymous"></script>
        <script src="js/datatables-simple-demo.js"></script>
    </body>
    <script>
        addSidebar();
        addRainsenseDropdown();
        getCurrentProg();   
        updateStatus('index');
        updateZoneList();
        getCreds();
        detaQuery(30,'T');
        var element = document.getElementById("manualrunbutton");
        var celement = document.getElementById("cancelbutton");
        element.style.display = "none";
        celement.style.display = "none";
        var statusInterval = setInterval(updateStatus, 5000,'index');
        </script>
</html>
