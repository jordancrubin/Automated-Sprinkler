<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="ESP 32 Irrigation Automation Dashboard" />
        <meta name="author" content="Jordan Rubin" />
        <title>Dashboard - RubinTech</title>
        <link href="css/styles.css" rel="stylesheet" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js" crossorigin="anonymous"></script>
    </head>
    <body class="sb-nav-fixed">
        <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
            <!-- Navbar Brand-->
            <a class="navbar-brand ps-3" href="index.html"><i class="fas fa-faucet me-2"></i>ESP Irrigate</a>
            <!-- Sidebar Toggle-->
            <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i class="fas fa-bars"></i></button>
            <!-- Navbar Search -->
            <form class="d-none d-md-inline-block form-inline ms-auto me-0 me-md-3 my-2 my-md-0">
            </form>
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                    <div class="sb-sidenav-menu" id="sidenav-menu-content"> 
                    </div>
                </nav>
            </div>
            <div id="layoutSidenav_content">                
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4">Dashboard</h1>
                        <ol class="breadcrumb mb-4">
                            <li class="breadcrumb-item active">System Overview</li>
                        </ol>
                        <div class="row">
                            <div class="col-xl-12">
                                <div class="card mb-4">
                                    <div class="card-header">
                                        <i class="fas fa-cloud-sun me-1"></i>
                                        Local Weather
                                    </div>
                                    <div class="card-body">
                                        <div class="row align-items-center">
                                            <div class="col-3 text-center">
                                                <img id="weatherIcon" src="" alt="Weather" style="display:none; width: 100%; max-width: 80px;">
                                            </div>
                                            <div class="col-4 text-center">
                                                <h2 class="display-4" id="weatherTemp">--&deg;C</h2>
                                            </div>
                                            <div class="col-5">
                                                <h5 id="weatherDesc">Loading...</h5>
                                                <div class="small text-muted" id="weatherPop">Rain Chance: --%</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- System Status & Controls Card-->
                                <div class="card mb-4">
                                    <div class="card-header">
                                        <i class="fas fa-tachometer-alt me-1"></i>
                                        System Status & Controls
                                    </div>
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label for="activeprog" class="form-label">Active Programme</label>
                                                <select class="form-select" id="activeprog" onchange="activeProgChange()">
                                                    <option value="4" SELECTED>Disabled</option>
                                                    <option value="1">Programme A</option>
                                                    <option value="2">Programme B</option>
                                                    <option value="3">Programme C</option>
                                                </select>
                                            </div>
                                            <div class="col-md-6 mb-3" id="rainsenseselector">
                                                <!-- Rain sensor dropdown will be inserted here by JS -->
                                            </div>
                                            <div class="col-md-6 mb-3" id="owa_container">
                                                <label for="owaselector" class="form-label" id="owalabel">Use OWA Rain Delay</label>
                                                <select class="form-select" id="owaselector" onchange="owaChange()">
                                                    <option value="0">Disabled</option>
                                                    <option value="1">Enabled</option>
                                                </select>
                                            </div>
                                        </div>
                                        <hr/>
                                        <h5 class="card-title" id="state">Loading Status...</h5>
                                        <p class="card-text" id="stateInfo"></p>
                                        <p class="card-text" id="valveState"></p>
                                        <p class="card-text" id="rainState"></p>
                                        <div id="cancelbutton" style="display: none;"><button class="btn btn-danger" type="button" onclick="cancelRun()">Cancel Current Run</button></div>
                                    </div>
                                </div>
                                <!-- Manual Run Card-->
                                <div class="card mb-4" id="manualRunCard">
                                    <div class="card-header">
                                        <i class="fas fa-hand-pointer me-1"></i>
                                        Manual Run
                                    </div>
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-8"><div class="form-floating"><select class="form-select" id="manualrunlist" onchange="manualRunListChange()"><option value="" SELECTED>Choose a zone...</option></select><label for="manualrunlist">Select Zone to Start</label></div></div>
                                            <div class="col-md-4 d-grid"><div id="manualrunbutton" style="display: none;"><button class="btn btn-success" type="button" onclick="submitManualRun()">Begin Run</button></div></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card mb-4">
                                    <div class="card-header">
                                        <i class="fas fa-list-alt me-1"></i>
                                        Event Log
                                    </div>
                                    <div class="card-body h-100">
                                        <textarea class="form-control h-100" id="eventLog" readonly style="font-family: monospace; font-size: 0.8rem; resize: none; min-height: 200px;"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
                <!-- Logout Confirmation Modal -->
                <div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="logoutModalLabel" aria-hidden="true">
                  <div class="modal-dialog modal-dialog-centered" role="document">
                    <div class="modal-content">
                      <div class="modal-header">
                        <h5 class="modal-title" id="logoutModalLabel">Confirm Logout</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                      </div>
                      <div class="modal-body">
                        Are you sure you want to logout?
                      </div>
                      <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" id="confirmLogoutBtn">Logout</button>
                      </div>
                    </div>
                  </div>
                </div>
                <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-between small">
                            <div class="text-muted">Copyright &copy; Jordan Rubin 2023-2026</div>
                            <div>
                                <a href="#">Privacy Policy</a>
                                &middot;
                                <a href="#">Terms &amp; Conditions</a>
                            </div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="js/scripts.js"></script>
        <script src="js/timezone.js"></script>
    </body>
    <script>
        window.addEventListener('DOMContentLoaded', event => {
        addSidebar();
        addRainsenseDropdown();
        getCurrentProg();   
        updateStatus('index');
        updateZoneList();
        getLogHistory();
        var element = document.getElementById("manualrunbutton");
        var celement = document.getElementById("cancelbutton");
        element.style.display = "none";
        celement.style.display = "none";
        var statusInterval = setInterval(updateStatus, 5000,'index');
        });
    </script>
</html>
