    <script>
        window.addEventListener('DOMContentLoaded', event => {
        addSidebar();
        cookieChk();
        updateZoneList();
        
        function drawConsumptionChart() {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    var rawData = JSON.parse(this.responseText);
                    var dailyConsumption = {};
                    
                    if (rawData) {
                        Object.keys(rawData).forEach(function(key) {
                            var item = rawData[key];
                            var date = new Date(item.key * 1000);
                            var dateStr = date.toLocaleDateString();
                            if (!dailyConsumption[dateStr]) {
                                dailyConsumption[dateStr] = 0;
                            }
                            dailyConsumption[dateStr] += parseFloat(item.consumption || 0);
                        });
                    }

                    var labels = Object.keys(dailyConsumption).sort(function(a, b) {
                        return new Date(a) - new Date(b);
                    });
                    var dataPoints = labels.map(function(label) {
                        return dailyConsumption[label].toFixed(2);
                    });

                    var ctx = document.getElementById("consumptionChart");
                    var myBarChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: "Consumption",
                                backgroundColor: "rgba(2,117,216,1)",
                                borderColor: "rgba(2,117,216,1)",
                                data: dataPoints,
                            }],
                        },
                        options: {
                            scales: {
                                xAxes: [{ time: { unit: 'day' }, gridLines: { display: false }, ticks: { maxTicksLimit: 7 } }],
                                yAxes: [{ ticks: { min: 0, maxTicksLimit: 5 }, gridLines: { display: true } }],
                            },
                            legend: { display: false }
                        }
                    });
                }
            };
            xhr.open("GET", "getHistory?days=30", true);
            xhr.send();
        }
        drawConsumptionChart();
        });
    </script>
