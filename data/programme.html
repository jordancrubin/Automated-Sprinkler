            cookieChk();

        $(this).closest("tr").remove();

function addRow(thiscount){ 
  var newRow = $("<tr>");
  var cols = "";
  cols += '<td><input type="text" class="form-control" id="'+program+'zoneName' + thiscount + '" name="'+program+'zoneName' + thiscount + '"/readonly></td>';
  cols += '<td><input type="text" class="form-control" id="'+program+'zoneDur' + thiscount + '" maxlength="3" name="'+program+'zoneDur' + thiscount + '"/></td>';
  newRow.append(cols);
  $("table.order-list"+program).append(newRow);
}

function submitConfig(){
  for (i = 3; i < 6; i++) {
    counter=1;
    program = "A";
    if(i==4){program ="B"};
    if(i==5){program ="C"};
    data.zones.forEach(function(zone) {    
      zone[i] =  document.getElementById(program+"zoneDur"+counter).value;
      counter++;                     
    });
  }
  data.pass = '';
  let err = [];
  var msg = '';
  var wkflw = {};
  let programmea = [];
  let programmeb = [];
  let programmec = [];
  a = document.getElementById("stA").value; programmea.push(a);
  b = document.getElementById("stB").value; programmeb.push(b);
  c = document.getElementById("stC").value; programmec.push(c);
  for (i = 1; i < 4; i++) {
    program = "A";
    if(i==2){program ="B"};
    if(i==3){program ="C"};
    for (j = 1; j < 8; j++) { 
      var day = document.getElementById(program+"-"+j).checked;
        if(i==1){programmea.push(day);}
        if(i==2){programmeb.push(day);}
        if(i==3){programmec.push(day);}
    }
  }
  if ( (a<0)||(a>2359)||(b<0)||(b>2359)||(c<0)||(c>2359)) {
    err.push('Start time must be between 0 and 2359 hours');
  }
  wkflw.programa = programmea;
  wkflw.programb = programmeb;
  wkflw.programc = programmec; 
  if (err.length==0){
    var xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function() {
      if (this.readyState == 4 && this.status == 200) {
        var returndata = JSON.parse(this.responseText);
                      if (returndata.s == "0"){
                        var xhx = new XMLHttpRequest();
                        xhx.onreadystatechange = function() {
                       if (this.readyState == 4 && this.status == 200) {
                        var returndata = JSON.parse(this.responseText);
                        if (returndata.s == "0"){
                          alert("System updated, device will reboot with changes...");
                          window.location.href = "login.html";
                        }
                       }
                      }; 
                    var jsonstr = JSON.stringify(wkflw);
                    xhx.open("POST", "updateConfig", true);
                    xhx.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
                    xhx.send("testval="+jsonstr+"&filetype=program");
                      }
                      else {
                        alert("Update error, device wil reboot, try again...");
                        window.location.href = "login.html";
                      }
      }
    };  
    var jsonstr = JSON.stringify(data);
    xhr.open("POST", "updateConfig", true);
    xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
    xhr.send("testval="+jsonstr+"&filetype=cfg");
  }
  document.getElementById('errorContent').innerHTML = msg;
  if (err.length !=0){
    $("#infoModalCenter").modal("toggle");
  }
 }

function getConf(){
  var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                data = JSON.parse(this.responseText);               
                if (data.e){
                  if (data.e == "np"){
                    alert("You do not have permission to accces this feature.");
                    return 1;
                  }
                }
                for (i = 3; i < 6; i++) {
                    counter=1;
                    program = "A";
                    if(i==4){program ="B"};
                    if(i==5){program ="C"};
                    data.zones.forEach(function(zone) {                
                      addRow(counter);  
                      document.getElementById(program+"zoneName"+counter).value = zone[1];
                      document.getElementById(program+"zoneDur"+counter).value = zone[i];      
                      counter++;
                    });
                }
                var xhx = new XMLHttpRequest();
                xhx.onreadystatechange = function() {
                  if (this.readyState == 4 && this.status == 200) {
                    var data2 = JSON.parse(this.responseText);
                    if (data2.e){
                      if (data2.e == "np"){
                      alert("You do not have permission to accces this feature.");
                      return 1;
                      }
                    }
                   document.getElementById("stA").value = data2.programa[0];
                   document.getElementById("stB").value = data2.programb[0];
                   document.getElementById("stC").value = data2.programc[0];
                   for (i = 1; i < 4; i++) {
                    for (j = 1; j < 8; j++) { 
                      if (i==1){document.getElementById("A-"+j).checked = data2.programa[j];}
                      if (i==2){document.getElementById("B-"+j).checked = data2.programb[j];}
                      if (i==3){document.getElementById("C-"+j).checked = data2.programc[j];}
                    }
                  }
                  }
                };
                xhx.open("POST", "getConf", true);
                xhx.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
                xhx.send("filetype=prg");   
            }
        };
      xhr.open("POST", "getConf", true);
      xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
      xhr.send("filetype=cfg");
}
