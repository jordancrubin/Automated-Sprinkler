; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:node32s]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
lib_compat_mode = strict
lib_ldf_mode = chain
board = node32s
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
monitor_speed = 115200
build_flags = -Os
monitor_filters = esp32_exception_decoder
lib_deps =
	ESP32Async/AsyncTCP
 	ESP32Async/ESPAsyncWebServer
	https://github.com/arduino-libraries/NTPClient.git
	jordancrubin/Watermeter @ ^1.0.8
	jordancrubin/Ballvalve @ ^1.1.1
	bblanchon/ArduinoJson @ ^6.19.2
	mathertel/LiquidCrystal_PCF8574 @ ^2.2.0
	igorantolic/Ai Esp32 Rotary Encoder @ ^1.4
	xreef/PCF8575 library @ ^1.0.3
	mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 @ ^4.4.17